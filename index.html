<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OmniBoard — The Last Keyboard You’ll Ever Need</title>

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jellylambo.github.io/Omniboard-/">
  <meta property="og:title" content="OmniBoard — The Last Keyboard You’ll Ever Need">
  <meta property="og:description" content="Experience the world’s first intelligent interface that thinks with you while keeping your data sovereign. No app-switching. No tracking. Just flow.">
  <meta property="og:image" content="https://jellylambo.github.io/Omniboard-/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://jellylambo.github.io/Omniboard-/preview.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  
  <style>
    :root {
      --bg: #0B0E14;
      --cyan: #00F2FF;
      --silver: #E0E0E0;
      --gray: #A0A0A0;
      --dark-gray: #1E2530;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--silver);
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    #particles-js {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    nav {
      position: fixed;
      top: 0; width: 100%; z-index: 100;
      background: rgba(11, 14, 20, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 242, 255, 0.1);
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 80px;
    }

    .logo { font-size: 1.6rem; font-weight: 700; color: white; }

    .nav-links { display: flex; gap: 48px; }

    .nav-links a {
      color: var(--silver);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--cyan); }

    .btn {
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s;
      cursor: pointer;
      border: none;
    }

    .btn-cyan { background: var(--cyan); color: #000; }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 100px;
      text-align: center;
    }

    .hero-content {
      background: rgba(11, 14, 20, 0.65);
      backdrop-filter: blur(8px);
      padding: 3rem 2.5rem;
      border-radius: 20px;
      border: 1px solid rgba(0, 242, 255, 0.12);
      max-width: 900px;
      margin: 0 auto;
    }

    /* Video Styling */
    .hero-video {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      margin: 3rem auto;
      border-radius: 16px;
      border: 1px solid rgba(0, 242, 255, 0.2);
      box-shadow: 0 0 50px rgba(0, 242, 255, 0.15);
      display: block;
      object-fit: cover;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      margin-top: 40px;
    }

    .feature {
      padding: 30px;
      background: rgba(30, 37, 48, 0.5);
      border-radius: 15px;
      border: 1px solid rgba(0, 242, 255, 0.1);
    }

    footer {
      padding: 60px 0;
      text-align: center;
      border-top: 1px solid rgba(0, 242, 255, 0.1);
    }
  </style>
</head>
<body>

  <div id="particles-js"></div>

  <nav>
    <div class="container nav-inner">
      <div class="logo">OmniBoard</div>
      <div class="nav-links">
        <a href="#features">Features</a>
        <a href="#security">Security</a>
      </div>
      <button class="btn btn-cyan" data-tally-open="PdO5lV">Join Waitlist</button>
    </div>
  </nav>

  <section class="hero">
    <div class="container">
      <div class="hero-content">
        <h1>The Last Keyboard You’ll Ever Need.</h1>
        <p>Experience the world’s first intelligent interface that thinks with you while keeping your data sovereign.</p>

        <video autoplay muted loop playsinline poster="preview.jpg" class="hero-video">
          <source src="1001190338.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>

        <button class="btn btn-cyan" data-tally-open="PdO5lV" style="padding: 20px 48px; font-size:1.2rem;">
          Get Early Access
        </button>
      </div>
    </div>
  </section>

  <script async src="https://tally.so/widgets/embed.js"></script>

  <script>
    particlesJS('particles-js', {
      "particles": {
        "number": { "value": 60 },
        "color": { "value": "#00f2ff" },
        "opacity": { "value": 0.3 },
        "move": { "enable": true, "speed": 1.5 }
      }
    });
  </script>

</body>
  </html>
