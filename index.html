<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OmniBoard — The Last Keyboard You’ll Ever Need</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- particles.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <!-- Open Graph / WhatsApp, Facebook, LinkedIn, Discord, etc. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jellylambo.github.io/Omniboard-/">
  <meta property="og:title" content="OmniBoard — The Last Keyboard You’ll Ever Need">
  <meta property="og:description" content="Experience the world’s first intelligent interface that thinks with you while keeping your data sovereign. No app-switching. No tracking. Just flow.">
  <meta property="og:image" content="https://raw.githubusercontent.com/jellylambo/Omniboard-/main/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://jellylambo.github.io/Omniboard-/">
  <meta name="twitter:title" content="OmniBoard — The Last Keyboard You’ll Ever Need">
  <meta name="twitter:description" content="Experience the world’s first intelligent interface that thinks with you while keeping your data sovereign. No app-switching. No tracking. Just flow.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/jellylambo/Omniboard-/main/preview.jpg">

  <style>
    /* Your existing styles (unchanged) */
    :root {
      --bg: #0B0E14;
      --cyan: #00F2FF;
      --silver: #E0E0E0;
      --gray: #A0A0A0;
      --dark-gray: #1E2530;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--silver);
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

    /* Navigation, hero, features, manifesto, footer styles unchanged — kept exactly as you had */

    @media (max-width: 768px) {
      .hero h1 { font-size: 3.4rem; }
      .section { padding: 100px 0; }
      .manifesto { padding: 60px 24px; }
      .hero-content { padding: 2.5rem 1.8rem; }
    }
  </style>
</head>
<body>

  <!-- Particle Background -->
  <div id="particles-js"></div>

  <!-- Navigation -->
  <nav>
    <div class="container nav-inner">
      <div class="logo">OmniBoard</div>
      <div class="nav-links">
        <a href="#features">Features</a>
        <a href="#security">Security</a>
        <a href="#manifesto">Manifesto</a>
      </div>
      <button class="btn btn-cyan" data-tally-open="PdO5lV" data-tally-layout="modal" data-tally-emoji-text="👋" data-tally-emoji-animation="wave">
        Join Waitlist
      </button>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <div class="hero-content">
        <h1>The Last Keyboard You’ll Ever Need.</h1>
        <p>Experience the world’s first intelligent interface that thinks with you while keeping your data sovereign. No app-switching. No tracking. Just flow.</p>

        <!-- YouTube video iframe (replace YOUR_VIDEO_ID with your actual unlisted video ID) -->
        <div class="video-placeholder">
          <iframe 
            width="100%" 
            height="100%" 
            src="https://www.youtube.com/embed/YOUR_VIDEO_ID?rel=0&modestbranding=1" 
            title="OmniBoard Demo" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>

        <div class="form-container">
          <button 
            class="btn btn-cyan" 
            data-tally-open="PdO5lV" 
            style="padding: 20px 48px; font-size:1.2rem; width: 100%; max-width: 400px;"
          >
            Get Early Access
          </button>
        </div>

        <p style="font-size: 0.9rem; margin-top: 15px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; font-weight: 600;">Join 5,000+ early adopters</p>
      </div>
    </div>
  </section>

  <!-- Features, Manifesto, Footer sections unchanged -->

  <!-- Tally embed script -->
  <script async src="https://tally.so/widgets/embed.js"></script>

  <!-- Particles.js -->
  <script>
    particlesJS('particles-js', {
      "particles": {
        "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
        "color": { "value": "#00f2ff" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.3, "random": true },
        "size": { "value": 3, "random": true },
        "line_linked": { "enable": true, "distance": 150, "color": "#00f2ff", "opacity": 0.2, "width": 1 },
        "move": { "enable": true, "speed": 1.5, "direction": "none", "out_mode": "out" }
      },
      "interactivity": {
        "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": true, "mode": "push" } }
      },
      "retina_detect": true
    });
  </script>

</body>
  </html>
